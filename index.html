<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body { margin: 0; background: transparent; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; }
        .swiper { width: 100vw; height: 100vh; }
        .swiper-slide { position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        
        /* The Background Image */
        .bg-image { 
            position: absolute; width: 100%; height: 100%; object-fit: cover; 
            filter: brightness(0.4); /* Darken so text is easy to read */
        }
        
        /* The Content Box - Specialized for small stream windows */
        .content { 
            position: relative; z-index: 10; text-align: center; width: 90%; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); /* Critical for stream readability */
        }

        .source-tag { 
            background: #f1c40f; color: #000; /* Match your neon sign color */
            padding: 4px 12px; border-radius: 4px; font-size: 14px; 
            font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: inline-block;
        }

        h2 { font-size: 24px; line-height: 1.1; margin: 10px 0; letter-spacing: -1px; }
        
        /* Summary is often too small for stream viewers, let's keep it very short or hidden */
        p { font-size: 16px; color: #eee; font-weight: normal; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Progress bar color to match the vibe */
        .swiper-pagination-progressbar-fill { background: #f1c40f !important; }
    </style>
</head>
<body>
    <div class="swiper">
        <div class="swiper-wrapper" id="news-container"></div>
        <div class="swiper-pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        fetch('news.json').then(r => r.json()).then(data => {
            const container = document.getElementById('news-container');
            data.forEach(story => {
                container.innerHTML += `
                    <div class="swiper-slide">
                        <img class="bg-image" src="${story.image}" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600'">
                        <div class="content">
                            <span class="source-tag">${story.source}</span>
                            <h2>${story.title}</h2>
                            <p>${story.summary}</p>
                        </div>
                    </div>`;
            });
            new Swiper('.swiper', { 
                loop: true, effect: 'fade', 
                autoplay: { delay: 10000 },
                pagination: { el: '.swiper-pagination', type: 'progressbar' }
            });
        });
    </script>
</body>
</html>
