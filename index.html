<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYSvibes News Slideshow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #000; 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            height: 100vh; 
            overflow: hidden;
        }

        .swiper { width: 100%; height: 100vh; }

        .swiper-slide { 
            position: relative; 
            display: flex; 
            align-items: center;    /* Vertical Center */
            justify-content: center; /* Horizontal Center */
            overflow: hidden; 
            background: #111;
        }
        
        /* Background Image Styling */
        .bg-image { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
            filter: brightness(0.5) blur(2px); /* Dims and blurs slightly for readability */
            transition: transform 8s linear; /* Slow zoom effect */
        }

        /* Subtle zoom effect when slide is active */
        .swiper-slide-active .bg-image {
            transform: scale(1.1);
        }
        
        /* The News Card in the Middle */
        .content { 
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.7); 
            padding: 40px; 
            border-radius: 24px; 
            width: 90%;
            max-width: 700px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .source-tag { 
            background: #ff4757; 
            color: white; 
            padding: 6px 14px; 
            border-radius: 50px; 
            font-size: 0.75rem; 
            font-weight: bold;
            text-transform: uppercase; 
            letter-spacing: 1px;
            margin-bottom: 20px; 
            display: inline-block; 
        }

        h2 { 
            margin: 15px 0; 
            font-size: 2.2rem; 
            line-height: 1.2;
            font-weight: 800;
        }

        p { 
            font-size: 1.1rem; 
            color: #ddd; 
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .read-more { 
            display: inline-block;
            background: white;
            color: black;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none; 
            font-weight: bold; 
            transition: transform 0.2s;
        }

        .read-more:hover { transform: scale(1.05); background: #eee; }

        /* Progress Bar at the top */
        .swiper-pagination-progressbar { background: rgba(255,255,255,0.2) !important; height: 6px !important; }
        .swiper-pagination-progressbar-fill { background: #ff4757 !important; }
    </style>
</head>
<body>

    <div class="swiper">
        <div class="swiper-wrapper" id="news-container">
            </div>
        <div class="swiper-pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // Go get the news.json file generated by the Python Robot
        fetch('news.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('news-container');
                
                data.forEach(story => {
                    const slide = `
                        <div class="swiper-slide">
                            <img class="bg-image" src="${story.image}" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=2070&auto=format&fit=crop'">
                            <div class="content">
                                <span class="source-tag">${story.source}</span>
                                <h2>${story.title}</h2>
                                <p>${story.summary}</p>
                                <a class="read-more" href="${story.link}" target="_blank">Read Story</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += slide;
                });

                // Initialize the Slideshow
                new Swiper('.swiper', {
                    loop: true,
                    effect: 'fade', // Smooth cross-fade transition
                    fadeEffect: { crossFade: true },
                    autoplay: { 
                        delay: 10000, 
                        disableOnInteraction: false 
                    },
                    pagination: { 
                        el: '.swiper-pagination', 
                        type: 'progressbar' 
                    },
                });
            })
            .catch(err => console.error("Error loading news:", err));
    </script>
</body>
</html>
