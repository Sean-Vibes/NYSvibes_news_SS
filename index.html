<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        .swiper { width: 100%; height: 100%; }
        .swiper-slide { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        
        .bg-image { 
            position: absolute; width: 100%; height: 100%; object-fit: cover; 
            z-index: 1; filter: brightness(0.3); 
        }
        
        .content { 
            position: relative; z-index: 10; text-align: center; 
            width: 90%; /* Keeps text away from the very edges */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .source-tag { 
            background: #f1c40f; color: black; padding: 4px 12px; 
            border-radius: 4px; font-size: 1rem; font-weight: 900;
            text-transform: uppercase; margin-bottom: 10px;
        }

        h2 { 
            /* This 'vw' unit makes the font size react to the width of the box */
            font-size: 8vw; 
            line-height: 1;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 5px 15px rgba(0,0,0,0.8);
            display: block;
            width: 100%;
        }

        .swiper-pagination-progressbar { bottom: 0 !important; top: auto !important; height: 8px !important; }
        .swiper-pagination-progressbar-fill { background: #f1c40f !important; }
    </style>
</head>
<body>
    <div class="swiper">
        <div class="swiper-wrapper" id="news-container"></div>
        <div class="swiper-pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        fetch('news.json').then(r => r.json()).then(data => {
            const container = document.getElementById('news-container');
            data.forEach(story => {
                container.innerHTML += `
                    <div class="swiper-slide">
                        <img class="bg-image" src="${story.image}" onerror="this.src='https://images.unsplash.com/photo-1586339949916-3e9457bef6d3?q=80&w=1000'">
                        <div class="content">
                            <span class="source-tag">${story.source}</span>
                            <h2>${story.title}</h2>
                        </div>
                    </div>`;
            });

            const swiper = new Swiper('.swiper', {
                loop: true,
                effect: 'fade',
                autoplay: { delay: 10000 },
                pagination: { el: '.swiper-pagination', type: 'progressbar' }
            });
        });
    </script>
</body>
</html>
